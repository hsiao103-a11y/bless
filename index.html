<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慈惠寺觀音佛祖 隨機祈福與賜福籤詩</title>
  <style>
    :root {
      --primary-color: #b71c1c;
      --gold-color: #d4af37;
      --bg-gradient: linear-gradient(135deg, #2b0808 0%, #880e4f 50%, #4a0007 100%);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 2px rgba(212, 175, 55, 0.5);
      text-align: center;
      width: 100%;
      max-width: 450px;
      box-sizing: border-box;
      position: relative;
    }

    h1 {
      color: var(--primary-color);
      font-size: 1.6rem;
      margin-top: 0;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 80%;
      padding: 12px;
      font-size: 1.05rem;
      border: 2px solid #ffe0b2;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 15px;
      outline: none;
    }

    button.btn-draw {
      background: linear-gradient(135deg, #d32f2f, #b71c1c);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
      transition: transform 0.2s;
    }

    button.btn-draw:active {
      transform: scale(0.95);
    }

    /* 籤詩與祝福顯示區塊 */
    .blessing-result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #fff8e1;
      border: 2px solid var(--gold-color);
      border-radius: 15px;
      box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2);
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .blessing-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .blessing-quote {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #333;
      font-weight: 500;
      margin: 15px 0;
      white-space: pre-line;
    }

    .blessing-meaning {
      font-size: 0.95rem;
      color: #555;
      border-top: 1px dashed #d4af37;
      padding-top: 10px;
      margin-top: 10px;
    }

    .lot-animation {
      display: none;
      font-size: 3rem;
      margin: 20px 0;
      animation: shake 0.6s infinite;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      50% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🙏 慈惠寺觀音佛祖</h1>
    <div class="subtitle">同樂70週年 慶典賜福與隨機吉祥話</div>

    <div id="input-section">
      <input type="text" id="user-name" placeholder="請輸入您的姓名（可留空）" maxlength="10">
      <br>
      <button class="btn-draw" onclick="drawBlessing()">抽取佛祖賜福</button>
    </div>

    <div class="lot-animation" id="lot-anim">🧧</div>

    <div class="blessing-result" id="result-box">
      <div class="blessing-title" id="result-user"></div>
      <div class="blessing-quote" id="result-quote"></div>
      <div class="blessing-meaning" id="result-meaning"></div>
      <br>
      <button style="background: none; border: 1px solid #999; padding: 6px 15px; border-radius: 15px; color: #666; cursor: pointer;" onclick="resetBlessing()">再抽一次</button>
    </div>
  </div>

  <script>
    // 觀音佛祖與慈惠寺主題之隨機祝福話語庫
    const blessings = [
      {
        quote: "【慈悲普照．福慧雙全】\n觀音佛祖慈悲加持，願您心中無罣礙，事事皆順心。",
        meaning: "💡 佛祖開示：保持平常心與善念，近期所祈求之事將會迎來轉機與順境。"
      },
      {
        quote: "【慈航普渡．平安喜樂】\n佛光注照大吉祥，家和萬事興，平安即是最大的福氣。",
        meaning: "💡 佛祖開示：家人身體健康、家庭和睦，事業與生活皆能穩健發展。"
      },
      {
        quote: "【千手護持．貴人相助】\n千手觀音護護佑，路途順遂，處處逢貴人。",
        meaning: "💡 佛祖開示：近期身邊會有貴人相助，遇到困難時不妨多與長輩或朋友請益。"
      },
      {
        quote: "【甘露潤心．隨緣自在】\n菩薩甘露水洗滌煩惱，心寬路就廣，好運自然來。",
        meaning: "💡 佛祖開示：放下焦慮與執著，順其自然發展，反而能得到意想不到的好結果。"
      },
      {
        quote: "【同樂慶典．吉祥如意】\n同樂70聚福氣，佛祖賜福賀新春/慶典，福祿壽喜常相隨。",
        meaning: "💡 佛祖開示：參與盛會共結善緣，多行善事必有後福，諸事皆有美好收穫。"
      },
      {
        quote: "【心光明亮．智慧開朗】\n點亮心燈照前程，智慧增長，所求皆能如願。",
        meaning: "💡 佛祖開示：清晰的思維會帶您走出迷惘，保持信心，明確的方向就在眼前。"
      }
    ];

    function drawBlessing() {
      const name = document.getElementById('user-name').value.trim() || '信眾';
      const inputSection = document.getElementById('input-section');
      const anim = document.getElementById('lot-anim');
      const resultBox = document.getElementById('result-box');

      inputSection.style.display = 'none';
      anim.style.display = 'block';

      setTimeout(() => {
        anim.style.display = 'none';
        
        // 隨機抽取一則祝福
        const randomIndex = Math.floor(Math.random() * blessings.length);
        const item = blessings[randomIndex];

        document.getElementById('result-user').innerText = `✨ ${name} 的觀音佛祖賜福卡 ✨`;
        document.getElementById('result-quote').innerText = item.quote;
        document.getElementById('result-meaning').innerText = item.meaning;

        resultBox.style.display = 'block';
      }, 1200);
    }

    function resetBlessing() {
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('input-section').style.display = 'block';
    }
  </script>
</body>
</html>
